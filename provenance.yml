excluded_material:
  - source: third-party materials embedded or cited inside dontbesilent dbskill
    known_license: mixed-or-unknown
    included: false
    reason: the dbskill root license does not establish upstream rights for every embedded source
  - source: unaudited third-party content
    known_license: unknown
    included: false
    reason: no copying before provenance and license review

